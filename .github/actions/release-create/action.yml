name: Create a GitHub release
inputs:
  token: { required: true }
  name: { required: true }
  body: { required: true }
  tag: { required: true }
  commit: { required: true }
  draft: { default: false, required: false }
  prerelease: { default: false, required: false }
runs:
  using: composite
  steps:
    - uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        body: ${{ inputs.body }}
        name: ${{ inputs.name }}
        tag_name: ${{ inputs.tag }}
        target_commitish: ${{ inputs.commit }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
