name: RL-Secure Workflow
on:
  workflow_call:
    inputs:
      node-version: { required: true, type: string }
      artifact-name: { required: true, type: string }
    secrets:
      RLSECURE_LICENSE: { required: true }
      RLSECURE_SITE_KEY: { required: true }
      SIGNAL_HANDLER_TOKEN: { required: true }
      PRODSEC_TOOLS_USER: { required: true }
      PRODSEC_TOOLS_TOKEN: { required: true }
      PRODSEC_TOOLS_ARN: { required: true }

jobs:
  rl-scanner:
    name: Run Reversing Labs Scanner
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci

      - name: Create tgz artifact
        run: tar -czvf ${{ inputs.artifact-name }} --exclude=node_modules --exclude=.git .

      - id: get_version
        uses: ./.github/actions/get-version

      - name: Run RL Scanner
        id: rl-scan-conclusion
        uses: ./.github/actions/rl-scanner
        with:
          artifact-path: "$(pwd)/${{ inputs.artifact-name }}"
          version: "${{ steps.get_version.outputs.version }}"
        env:
          RLSECURE_LICENSE: ${{ secrets.RLSECURE_LICENSE }}
          RLSECURE_SITE_KEY: ${{ secrets.RLSECURE_SITE_KEY }}
          SIGNAL_HANDLER_TOKEN: ${{ secrets.SIGNAL_HANDLER_TOKEN }}
          PRODSEC_TOOLS_USER: ${{ secrets.PRODSEC_TOOLS_USER }}
          PRODSEC_TOOLS_TOKEN: ${{ secrets.PRODSEC_TOOLS_TOKEN }}
          PRODSEC_TOOLS_ARN: ${{ secrets.PRODSEC_TOOLS_ARN }}
